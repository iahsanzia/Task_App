<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">Task App</h1>
        <p class="subtitle">Tracking of Daily Tasks</p>
      </header>

      <section class="form-section">
        <form id="task-form" class="task-form">
          <div class="form-group">
            <input
              type="text"
              id="title"
              class="input-field"
              placeholder="Enter Task title"
              required
            />
          </div>

          <div class="form-group">
            <input
              type="text"
              id="note"
              class="input-field"
              placeholder="Add a note (Optional)"
            />
          </div>
          <div class="form-group">
            <label for="dueDate" class="input-label">Due Date:</label>
            <input
              type="date"
              id="dueDate"
              class="input-field"
              placeholder="Select a due date (Optional)"
            />
          </div>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
      </section>

      <section class="tasks-section">
        <div class="tasks-header">
          <h2 class="tasks-title">Tasks</h2>
          <span id="task-count" class="task-count">0 tasks</span>
        </div>
        <ul id="task-list" class="task-list"></ul>

        <div id="empty-state" class="empty-state">
          <p>No tasks yet. Create one to get started</p>
        </div>
      </section>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
